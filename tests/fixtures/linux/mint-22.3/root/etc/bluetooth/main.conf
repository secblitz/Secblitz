# List of plugins that should not be loaded on bluetoothd startup
#DisablePlugins = network,input

[General]
# Default adaptor name
# Defaults to 'BlueZ 5.xx' where xx is the version number
#Name = BlueZ

# Default device class. Only the major and minor device class bits are
# considered. Defaults to '0x000000'.
#Class = 0x000000

# How long to stay in discoverable mode before going back to non-discoverable
# The value is in seconds. Default is 180, i.e. 3 minutes.
# 0 = disable timer, i.e. stay discoverable forever
#DiscoverableTimeout = 180

[BR]
# The following values are used to load default adapter parameters for BR/EDR.
#PageScanType=1

[LE]
# The following values are used to load default adapter parameters for LE.
#MinAdvertisementInterval=
#MaxAdvertisementInterval=

[GATT]
# GATT attribute cache.
#Cache = always

[CSIS]
# SIRK - Set Identity Resolution Key (16 bytes in hexadecimal)
#SIRK = 0123456789abcdef0123456789abcdef

[AVDTP]
# AVDTP L2CAP Signalling Channel Mode.
#SessionMode = basic

[Policy]
# The ReconnectUUIDs defines the set of remote services that should try
# to be reconnected to in case of a link loss (link supervision
# timeout). The policy plugin should contain a sane set of values by
# default, but this list can be overridden here. By setting the list to
# empty the reconnection feature gets disabled.
#ReconnectUUIDs=00001112-0000-1000-8000-00805f9b34fb,0000111f-0000-1000-8000-00805f9b34fb,0000110a-0000-1000-8000-00805f9b34fb

# ReconnectAttempts define the number of attempts to reconnect after a link
# lost. Setting the value to 0 disables reconnecting feature.
#ReconnectAttempts=7

# ReconnectIntervals define the set of intervals in seconds to use in between
# attempts.
# If the number of attempts defined in ReconnectAttempts is bigger than the
# set of intervals the last interval is repeated until the last attempt.
#ReconnectIntervals=1, 2, 4, 8, 16, 32, 64

# AutoEnable defines option to enable all controllers when they are found.
# This includes adapters present on start as well as adapters that are plugged
# in later on. Defaults to 'true'.
AutoEnable=true

[AdvMon]
# Allow Advertisement Monitor handling to be disabled.
#AllowAdvMon=true
