name: Release

# Builds Secblitz from source for a version tag and prepares a DRAFT GitHub
# Release. Nothing is published to users by this workflow: the owner reviews
# the draft, signs the update feed offline, attaches it and publishes by hand
# (docs/RELEASING.md). Publishing starts publish-website.yml.
#
# The update-feed signing key is never used here. It stays offline.
#
# Both architectures (x64 and arm64) are built, signed and tested in parallel;
# the arm64 build runs natively on a Windows on ARM runner.
#
# Order: check tag, website and notes -> build exe (tests first) -> sign exe
# (SignPath, optional) -> pack setup -> sign setup (optional) -> test the
# installer -> checksums, parts lists and build attestations -> draft release. A broken
# installer stops the run before anything is drafted.
#
# The Linux .deb and .rpm for x86_64 and aarch64 are built beside the Windows
# jobs (tests first, then an install check of the real packages in distro
# containers) and are attested and drafted with the rest. They carry no
# repository entry: the repository signing key never reaches CI.
#
# The run is always on the tag itself (push of the tag, or started by
# tag-release.yml with --ref <tag>), so the workflow code, the built source and
# the commit named in the attestations are the same commit.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # To rebuild by hand: Actions, Release, Run workflow. Choose the TAG (not a
  # branch) under "Use workflow from" and type the same tag below.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v0.8.0. Must be the same tag as chosen under 'Use workflow from'."
        required: true
        type: string

# No permission by default. Every job asks for exactly what it needs.
permissions: {}

# One release build at a time. A second one waits instead of running beside it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Check tag, version, website and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      signing: ${{ steps.check.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the Python packages the release tests need (hash-pinned)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/requirements-release.txt
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Check the tag against Cargo.toml, the changelog and the website
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          # Read once, here, from the REPOSITORY variable. Every later job uses this output.
          SIGNING_VAR: ${{ vars.SIGNPATH_ENABLED }}
        run: |
          set -euo pipefail
          TAG="$REF_NAME"
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run the release on a tag. Choose the tag under 'Use workflow from'."; exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_TAG" != "$TAG" ]; then
            echo "::error::The tag you typed does not match the tag chosen under 'Use workflow from'."; exit 1
          fi
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH."; exit 1
          fi
          version="${BASH_REMATCH[1]}"
          cargo_version=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -n 1)
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $cargo_version."; exit 1
          fi
          # The release must come from code that is on main.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG is not on the main branch."; exit 1
          fi
          # Fails when the changelog has no dated section with entries. The signing
          # footer names SignPath, so it is added only when the files are signed.
          footer=()
          if [ "$SIGNING_VAR" = "true" ]; then footer=(--with-footer); fi
          python3 scripts/release-notes.py "$version" "${footer[@]}" > release-notes.md
          # Fails when the website or README show any other version, or lack
          # the download link or the checksum element.
          python3 scripts/bump-version.py "$version" --check-site
          # The pinned hashes of the older downloads must cover the whole list.
          python3 scripts/historical-downloads.py check
          if [ "$SIGNING_VAR" = "true" ]; then echo "signing=true" >> "$GITHUB_OUTPUT"; else echo "signing=false" >> "$GITHUB_OUTPUT"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Release tool tests
        run: |
          python3 scripts/release-tests.py
          python3 scripts/bump-version-tests.py
      - name: Keep the release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  build-exe:
    name: Build the exe from source (tests first)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Initialize x64 MSVC tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      # No build or download cache here: a poisoned cache must never reach a release.
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version --verbose
      - name: Test, lint and build the exe
        shell: pwsh
        run: ./scripts/build-release.ps1 -Stage Exe
      - name: Upload the unsigned exe
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exe-unsigned
          path: dist/secblitz-*-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  sign-exe:
    name: Sign the exe (SignPath)
    needs: [verify, build-exe]
    # Off until the owner sets the REPOSITORY variable SIGNPATH_ENABLED to true
    # (not an environment variable: the verify job reads it once).
    if: ${{ needs.verify.outputs.signing == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The SignPath token lives in this environment only (docs/RELEASING.md).
    environment: signing
    permissions:
      contents: read
      actions: read   # SignPath reads the uploaded artifact from this run
    steps:
      - name: Submit the exe to SignPath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build-exe.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-exe
      - name: Upload the signed exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exe-signed
          path: signed-exe/secblitz-*-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  build-setup:
    name: Pack the setup from the (signed) exe
    needs: [verify, build-exe, sign-exe]
    # Runs when the exe was built and signing either succeeded or is switched off.
    if: ${{ !cancelled() && needs.build-exe.result == 'success' && (needs.sign-exe.result == 'success' || needs.sign-exe.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Get the unsigned exe
        if: ${{ needs.verify.outputs.signing != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exe-unsigned
          path: dist
      - name: Get the signed exe
        if: ${{ needs.verify.outputs.signing == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exe-signed
          path: dist
      - name: Check the exe signature
        if: ${{ needs.verify.outputs.signing == 'true' }}
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem dist/secblitz-*-windows-x64.exe)
          if ($exe.Count -ne 1) { throw 'Expected exactly one exe.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe[0].FullName
          $signature | Format-List Status, StatusMessage, SignerCertificate
          if ($signature.Status -ne 'Valid') { throw "The signed exe is not validly signed: $($signature.Status)" }
      - name: Build the setup (Inno Setup)
        shell: pwsh
        run: ./scripts/build-release.ps1 -Stage Setup -DownloadInno
      - name: Upload the unsigned setup
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup-unsigned
          path: dist/secblitz-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  sign-setup:
    name: Sign the setup (SignPath)
    needs: [verify, build-setup]
    if: ${{ needs.verify.outputs.signing == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: signing
    permissions:
      contents: read
      actions: read   # SignPath reads the uploaded artifact from this run
    steps:
      - name: Submit the setup to SignPath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build-setup.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-setup
      - name: Upload the signed setup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup-signed
          path: signed-setup/secblitz-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  build-exe-arm64:
    name: Build the arm64 exe from source (tests first)
    needs: verify
    runs-on: windows-11-arm
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Initialize arm64 MSVC tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64
      # No build or download cache here: a poisoned cache must never reach a release.
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component clippy --component rustfmt --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version --verbose
      - name: Test, lint and build the exe
        shell: pwsh
        run: ./scripts/build-release.ps1 -Stage Exe -Arch arm64
      - name: Upload the unsigned exe
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exe-unsigned-arm64
          path: dist/secblitz-*-windows-arm64.exe
          if-no-files-found: error
          retention-days: 14

  sign-exe-arm64:
    name: Sign the arm64 exe (SignPath)
    needs: [verify, build-exe-arm64]
    # Off until the owner sets the REPOSITORY variable SIGNPATH_ENABLED to true
    # (not an environment variable: the verify job reads it once).
    if: ${{ needs.verify.outputs.signing == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The SignPath token lives in this environment only (docs/RELEASING.md).
    environment: signing
    permissions:
      contents: read
      actions: read   # SignPath reads the uploaded artifact from this run
    steps:
      - name: Submit the exe to SignPath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build-exe-arm64.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-exe-arm64
      - name: Upload the signed exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exe-signed-arm64
          path: signed-exe-arm64/secblitz-*-windows-arm64.exe
          if-no-files-found: error
          retention-days: 14

  build-setup-arm64:
    name: Pack the arm64 setup from the (signed) exe
    needs: [verify, build-exe-arm64, sign-exe-arm64]
    # Runs when the exe was built and signing either succeeded or is switched off.
    if: ${{ !cancelled() && needs.build-exe-arm64.result == 'success' && (needs.sign-exe-arm64.result == 'success' || needs.sign-exe-arm64.result == 'skipped') }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Get the unsigned exe
        if: ${{ needs.verify.outputs.signing != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exe-unsigned-arm64
          path: dist
      - name: Get the signed exe
        if: ${{ needs.verify.outputs.signing == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exe-signed-arm64
          path: dist
      - name: Check the exe signature
        if: ${{ needs.verify.outputs.signing == 'true' }}
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem dist/secblitz-*-windows-arm64.exe)
          if ($exe.Count -ne 1) { throw 'Expected exactly one exe.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe[0].FullName
          $signature | Format-List Status, StatusMessage, SignerCertificate
          if ($signature.Status -ne 'Valid') { throw "The signed exe is not validly signed: $($signature.Status)" }
      - name: Build the setup (Inno Setup)
        shell: pwsh
        run: ./scripts/build-release.ps1 -Stage Setup -Arch arm64 -DownloadInno
      - name: Upload the unsigned setup
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup-unsigned-arm64
          path: dist/secblitz-*-windows-arm64-setup.exe
          if-no-files-found: error
          retention-days: 14

  sign-setup-arm64:
    name: Sign the arm64 setup (SignPath)
    needs: [verify, build-setup-arm64]
    if: ${{ needs.verify.outputs.signing == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: signing
    permissions:
      contents: read
      actions: read   # SignPath reads the uploaded artifact from this run
    steps:
      - name: Submit the setup to SignPath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build-setup-arm64.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-setup-arm64
      - name: Upload the signed setup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup-signed-arm64
          path: signed-setup-arm64/secblitz-*-windows-arm64-setup.exe
          if-no-files-found: error
          retention-days: 14

  test-installer:
    name: Test the final ${{ matrix.arch }} setup (exit codes, upgrade, uninstall)
    needs: [verify, build-setup, sign-setup, build-setup-arm64, sign-setup-arm64]
    # The tests run against the very bytes that will be released: the signed
    # setup when signing is on. A failure here stops the release before any
    # attestation or draft exists.
    if: ${{ !cancelled() && needs.build-setup.result == 'success' && (needs.sign-setup.result == 'success' || needs.sign-setup.result == 'skipped') && needs.build-setup-arm64.result == 'success' && (needs.sign-setup-arm64.result == 'success' || needs.sign-setup-arm64.result == 'skipped') }}
    # The same runner images the installer harnesses were proven on (windows.yml).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-2022
          - arch: arm64
            os: windows-11-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Get the final setup (signed when signing is on)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.signing == 'true' && format('setup-signed{0}', matrix.arch == 'arm64' && '-arm64' || '') || format('setup-unsigned{0}', matrix.arch == 'arm64' && '-arm64' || '') }}
          path: dist
      - name: Check the setup signature (when signing is on)
        if: ${{ needs.verify.outputs.signing == 'true' }}
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $setup = @(Get-ChildItem "dist/secblitz-*-windows-$env:ARCH-setup.exe")
          if ($setup.Count -ne 1) { throw 'Expected exactly one setup.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup[0].FullName
          $signature | Format-List Status, StatusMessage, SignerCertificate
          if ($signature.Status -ne 'Valid') { throw "The setup is not validly signed: $($signature.Status)" }
      - name: Install Inno Setup 6.7.3 where the runner image lacks it
        shell: pwsh
        run: ./scripts/install-inno.ps1
      - name: Check the Inno Setup compiler is on the runner
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw 'Inno Setup 6 is not installed on this runner image, so the installer tests cannot run. Nothing was released.'
          }
          Write-Host (Get-Item -LiteralPath $iscc).VersionInfo.FileVersion
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('scripts/build-release.ps1', 'scripts/install-inno.ps1', 'installer/maintenance.ps1', 'installer/test-maintenance.ps1', 'installer/test-lifecycle.ps1', 'installer/test-setup-exit.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Test installer path and ACL validation (Windows PowerShell 5.1)
        shell: powershell
        run: ./installer/test-maintenance.ps1
      - name: Test setup failure exit codes with isolated harnesses
        shell: powershell
        run: ./installer/test-setup-exit.ps1 -IsccPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
      - name: Test running monitor upgrade and uninstall preservation on the final setup
        shell: powershell
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $setup = @(Get-ChildItem "dist/secblitz-*-windows-$env:ARCH-setup.exe")
          if ($setup.Count -ne 1) { throw 'Expected exactly one built installer.' }
          ./installer/test-lifecycle.ps1 -SetupPath $setup[0].FullName

  build-linux:
    name: Build the ${{ matrix.arch }} Linux packages from source (tests first)
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
            package-arch: x86_64
          - arch: arm64
            os: ubuntu-24.04-arm
            package-arch: aarch64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      # No build or download cache here: a poisoned cache must never reach a release.
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy
          rustc --version --verbose
      - name: Test and lint
        run: |
          set -euo pipefail
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Install Pillow for the icons (hash-pinned)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/requirements-art.txt
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Build the program and the packages (debian:12 for older systems, fedora:44 for the rpm)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PACKAGE_ARCH: ${{ matrix.package-arch }}
        run: |
          set -euo pipefail
          python3 scripts/build-linux-packages.py "$VERSION" target/linux/secblitz target/linux/pkgs \
            --arch "$PACKAGE_ARCH" --build-binary --without-repository
          ls -l target/linux/pkgs
      - name: Name the packages as the update feed expects
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir dist
          debs=(target/linux/pkgs/*.deb)
          rpms=(target/linux/pkgs/*.rpm)
          test "${#debs[@]}" -eq 1
          test "${#rpms[@]}" -eq 1
          cp "${debs[0]}" "dist/secblitz-$VERSION-linux-$ARCH.deb"
          cp "${rpms[0]}" "dist/secblitz-$VERSION-linux-$ARCH.rpm"
          ls -l dist
      - name: Install the real packages in each distro, check them, remove them
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/linux-install-check.py dist "$VERSION" "$ARCH"
      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages-${{ matrix.arch }}
          path: dist/secblitz-*-linux-${{ matrix.arch }}.*
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Checksums and build provenance
    needs: [verify, build-exe, build-setup, sign-exe, sign-setup, build-exe-arm64, build-setup-arm64, sign-exe-arm64, sign-setup-arm64, test-installer, build-linux]
    if: ${{ !cancelled() && needs.test-installer.result == 'success' && needs.build-linux.result == 'success' && needs.build-setup.result == 'success' && (needs.sign-setup.result == 'success' || needs.sign-setup.result == 'skipped') && needs.build-setup-arm64.result == 'success' && (needs.sign-setup-arm64.result == 'success' || needs.sign-setup-arm64.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job may mint attestations. It cannot write to the repository.
    permissions:
      contents: read
      id-token: write       # sign the provenance with the run's OIDC identity
      attestations: write   # store the provenance attestations
    steps:
      - name: Get the exe (signed when signing is on)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.signing == 'true' && 'exe-signed' || 'exe-unsigned' }}
          path: release
      - name: Get the setup (signed when signing is on)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.signing == 'true' && 'setup-signed' || 'setup-unsigned' }}
          path: release
      - name: Get the arm64 exe (signed when signing is on)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.signing == 'true' && 'exe-signed-arm64' || 'exe-unsigned-arm64' }}
          path: release
      - name: Get the arm64 setup (signed when signing is on)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.signing == 'true' && 'setup-signed-arm64' || 'setup-unsigned-arm64' }}
          path: release
      - name: Get the Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-packages-*
          merge-multiple: true
          path: release
      - name: Write SHA256SUMS
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        working-directory: release
        run: |
          set -euo pipefail
          ls -l
          for kind in x64.deb x64.rpm arm64.deb arm64.rpm; do
            test -f "secblitz-$VERSION-linux-$kind"
          done
          test -f "secblitz-$VERSION-windows-x64.exe"
          test -f "secblitz-$VERSION-windows-x64-setup.exe"
          test -f "secblitz-$VERSION-windows-arm64.exe"
          test -f "secblitz-$VERSION-windows-arm64-setup.exe"
          test "$(ls | wc -l)" -eq 8
          # SHA256SUMS lists the four Windows programs only. The Linux packages
          # are covered by their attestations and by the signed update feeds.
          sha256sum "secblitz-$VERSION-windows-x64.exe" "secblitz-$VERSION-windows-x64-setup.exe" \
            "secblitz-$VERSION-windows-arm64.exe" "secblitz-$VERSION-windows-arm64-setup.exe" > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Check out the tagged source for the parts lists
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Write the parts lists (SBOM) from the tagged source
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        working-directory: source
        run: |
          set -euo pipefail
          python3 scripts/make-sbom.py --target x86_64-pc-windows-msvc --output "../release/secblitz-$VERSION-windows-x64.cdx.json"
          python3 scripts/make-sbom.py --target aarch64-pc-windows-msvc --output "../release/secblitz-$VERSION-windows-arm64.cdx.json"
          ls -l ../release
          python3 scripts/release-files.py "$VERSION" --check ../release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/secblitz-*-windows-x64.exe
            release/secblitz-*-windows-x64-setup.exe
            release/secblitz-*-windows-arm64.exe
            release/secblitz-*-windows-arm64-setup.exe
            release/secblitz-*-linux-x64.deb
            release/secblitz-*-linux-x64.rpm
            release/secblitz-*-linux-arm64.deb
            release/secblitz-*-linux-arm64.rpm
      - name: Attest the x64 parts list
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/secblitz-*-windows-x64.exe
          sbom-path: release/secblitz-${{ needs.verify.outputs.version }}-windows-x64.cdx.json
      - name: Attest the arm64 parts list
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/secblitz-*-windows-arm64.exe
          sbom-path: release/secblitz-${{ needs.verify.outputs.version }}-windows-arm64.cdx.json
      - name: Keep the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: release/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create the draft GitHub Release
    needs: [verify, attest]
    # Without SignPath the signing jobs are skipped, and a skipped job anywhere
    # upstream skips this one unless the condition is spelled out.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.attest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can write to the repository.
    permissions:
      contents: write   # create the draft release and attach the files
    steps:
      - name: Get the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - name: Get the release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Always a draft. The owner checks the files, signs the update feed
          # offline, attaches stable.json and publishes by hand.
          gh release create "$TAG" \
            --draft --verify-tag \
            --title "Secblitz $VERSION" \
            --notes-file notes/release-notes.md \
            release/secblitz-"$VERSION"-windows-x64-setup.exe \
            release/secblitz-"$VERSION"-windows-x64.exe \
            release/secblitz-"$VERSION"-windows-arm64-setup.exe \
            release/secblitz-"$VERSION"-windows-arm64.exe \
            release/secblitz-"$VERSION"-windows-x64.cdx.json \
            release/secblitz-"$VERSION"-windows-arm64.cdx.json \
            release/secblitz-"$VERSION"-linux-x64.deb \
            release/secblitz-"$VERSION"-linux-x64.rpm \
            release/secblitz-"$VERSION"-linux-arm64.deb \
            release/secblitz-"$VERSION"-linux-arm64.rpm \
            release/SHA256SUMS
