name: CI

# Tests and lints on every pull request; the release runs its own. A change to
# only the website or prose skips the app tests and the license check. Nothing here can publish
# anything: the token is read-only and there are no secrets. Releases are built
# by release.yml and deployed by publish-website.yml. Caching is fine here
# (nothing built here is released) and is never used in those two.
on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to the same pull request replaces the older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Which checks this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look at the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/app-changed.sh

  rust:
    name: Rust tests and lints (Windows ${{ matrix.arch }}, MSVC)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # The version lives in rust-toolchain.toml only.
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component clippy --component rustfmt --target $env:TARGET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version --verbose
      - name: Cache cargo downloads and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Tests
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --all-targets --target $env:TARGET
      - name: Clippy
        env:
          TARGET: ${{ matrix.target }}
        run: cargo clippy --locked --all-targets --target $env:TARGET -- -D warnings

  rust-linux:
    name: Rust tests and lints (Linux x64)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          # The version lives in rust-toolchain.toml only.
          channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          rustc --version --verbose
      - name: Cache cargo downloads and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --check
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  linux-packages:
    name: Linux packages, units and policy (distro containers)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Pillow for the icons (hash-pinned)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/requirements-art.txt
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Build placeholder packages, install, upgrade, remove and purge them in each distro
        # Uses a throwaway signing key and a placeholder program; the real key never reaches CI.
        run: python3 scripts/linux-packaging-tests.py --containers

  scripts:
    name: Locales, release tools, version bump and website tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Python packages the release tests need (hash-pinned)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/requirements-release.txt
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Installer languages and launch contracts
        run: python3 installer/check-locales.py
      - name: Release signing tools
        run: python3 scripts/release-tests.py
      - name: Version bump, website assembly and release notes tools
        run: python3 scripts/bump-version-tests.py
      - name: Parts list (SBOM) tool
        run: python3 scripts/make-sbom-tests.py
      - name: Older downloads all have a pinned checksum
        run: python3 scripts/historical-downloads.py check

  workflows:
    name: Workflow security audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor (pinned version and file hash)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/requirements-zizmor.txt
      - name: Audit the workflows and the Dependabot config
        env:
          # Lets the online checks (pinned SHAs really belong to the named tag) read public data.
          GH_TOKEN: ${{ github.token }}
        # Any finding fails the job. The auditor persona also reports the pedantic ones.
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --persona auditor --format plain .'

  licenses:
    name: Dependency licenses and sources (cargo-deny)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned cargo-deny
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-deny --version 0.20.2 --locked --root "$RUNNER_TEMP/cargo-deny"
      - name: Check that every dependency has an allowed license and comes from crates.io
        run: '"$RUNNER_TEMP/cargo-deny/bin/cargo-deny" --locked check licenses sources'
