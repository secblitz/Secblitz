[package]
name = "secblitz"
version = "1.5.0"
edition = "2021"
description = "A safer PC. Without headaches."
license = "MIT"
repository = "https://github.com/secblitz/Secblitz"
homepage = "https://secblitz.lol"
readme = "README.md"
keywords = ["windows", "security", "hardening", "privacy", "desktop"]
categories = ["command-line-utilities", "gui"]
publish = false
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10"
base64 = "0.23"
ed25519-dalek = "2"
hex = "0.4"
png = "0.18"
semver = "1"
sha2 = "0.10"
crc32fast = "1.5"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "canvas", "svg", "advanced", "thread-pool", "crisp", "image-without-codecs"] }
# Direct wgpu use is limited to the quick adapter probe in src/gui/render.rs.
wgpu = { version = "27", default-features = false, features = ["std", "dx12", "vulkan"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "http2"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Host builds/tests only; the Windows binary has no X11/Wayland code.
iced = { version = "0.14", default-features = false, features = ["x11", "wayland"] }
# The root helper's D-Bus service and the window's client. zbus 6 has no blocking API; calls run through zbus::block_on.
zbus = { version = "6.1.0", default-features = false, features = ["default-rt", "service"] }

[target.'cfg(unix)'.dependencies]
# The effective user id and O_NOFOLLOW, for the state folder and the single-window lock.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Time", "Win32_Security_Cryptography", "Win32_Security_Isolation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
# UI Automation reads the Firefox address bar. Already in the lock file through other crates.
windows = { version = "0.58", default-features = false, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility"] }

[features]
# Lets a release build write the page and last report to the file named by SECBLITZ_TEST_HOOK, for the machine that drives the window in tests.
test-hook = []

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

# Test and check builds: line numbers for our own code only, no debug info for
# dependencies. Keeps each build folder a fraction of the size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# Local fix for iced's CPU renderer: full-frame repaint on change (see
# vendor/iced_tiny_skia/src/window/compositor.rs, "Secblitz patch").
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
